[project]
name = "kraken-telegram-gateway"
version = "0.1.0"
description = "Dry-run first Telegram gateway for Kraken Futures trade intents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
kraken-metadata-validate = "kraken_telegram_gateway.gateway.metadata:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kraken_telegram_gateway*"]
