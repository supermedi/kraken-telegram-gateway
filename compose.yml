services:
  gateway:
    image: ${IMAGE_NAME:-ghcr.io/supermedi/kraken-telegram-gateway:latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8010}:8000"
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  gateway-data:
